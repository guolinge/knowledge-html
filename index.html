<script id="search-index" type="application/json">[{"slug":"blocks-cheatsheet","text":"积木速查：8 种表达原语 这个仓库的表达原语参考。同一段知识，用 journey 还是 lane-stack，取决于你要讲的是结构还是变化 —— 这个选择才是笔记质量的分水岭。 写作方法 工具 这份文件既是新建笔记的模板，也是积木语法参考。 正文用标准 markdown，需要更强表达力时用下面的自定义围栏块（围栏内是 yaml）。 01 基本约定 一级标题只写一次 ，渲染成页面 hero 的标题。它同时应该写进 meta.json 的 title 。 ## 01 · 标题 会自动把 01 渲染成编号徽章，并生成锚点进目录。 ### 标题 进目录，作为二级项。 行内支持 **粗体** 、 `代码` 、 [链接](url) ，以及裸 html（用于 span class= en 这类微调）。 02 lane-stack —— 分层 / 泳道流程 适合：etl 链路、请求生命周期、系统分层、任何「一层接一层」的结构。 layer 01 源系统层 数据真正产生的地方 mysql 订单库 orders / order_items binlog 埋点日志 page_view / click kafka 抽取 extract 把数据从业务库拿出来 数仓内部：分层建模 抽取层 决定多久同步一次 cdc 读 binlog op = insert/update/delete 准实时 全量快照 select * 整表拉取 每天一次 要点： tone 可选 muted / blue / violet / green / amber / red ，控制左侧色条、 layer 字样和默认标签色。 next 是两层之间的连接条，格式 中文名 :: 英文名 :: 补充说明 ，三段都可省略。 相邻且 group 相同的层会被自动包进虚线分组框 ，用来表示「这几个是一伙的」。 nodes[].tag / tone 覆盖单个节点的标签和配色。 03 journey —— 每一步的形态快照 适合：一个东西（一行数据、一个请求、一次支付）在流转过程中 长什么样 的变化。 ① 源系统 mysql · orders 只存最终状态 id 1001 status 1 魔法数字 dt 2024-05-20 新增分区 业务库只关心「现在是什么」， 没有城市、渠道 。 cdc 订阅 binlog 只传变化的那一行，不扫全表 ② 抽取 binlog event 含 before / after 复制 { op : update , table : orders } 拿到 before / after 才知道「哪一行被删了」。 要点： fields[].tone 支持 warn （黄）和 ok （绿），用来标出「这里有问题」和「这里修好了」。 notetone: bad 把行首的 → 换成 ! 。 code 会转义显示；想上色就改用 codehtml （内容按原始 html 输出）。 04 compare —— 多维对比 适合：两个及以上方案的横向对比。 维度 数据库 数据仓库 主要目的 支撑线上业务 数据分析、报表、决策 是否直接承接用户请求 是 通常不是 要点：单元格写字符串就是普通文本，写 {text, tone} 就渲染成彩色标签。窄屏会自动折叠成卡片。 05 callout —— 提示 / 陷阱 / 引用 🧱 为什么要分这么多层？因为 每一层只解决一个问题 。 中间任何一层算错，都能回到上一层重跑。 要点： quote: true 会把正文放大加粗，用于一句话结论。 text 里可以写多行 markdown。 06 checklist —— 正例 / 反例 延迟高，最快也要等下一次轮询 删除数据不容易准确识别 要点： tone 可选 cross （红叉）和 warn （黄叹号），不写就是绿勾。 07 quiz —— 自测 这是最容易被忽略、但最重要的一块。 知识库死于「收藏代替理解」， 每篇笔记结尾放 2~3 题，逼自己合上答案复述一遍。 cdc 是 flink 独有的功能吗？ 不是。cdc 是通用技术，flink cdc 只是 flink 生态里的一个连接器方案。 为什么不用定时轮询？ 延迟高、压业务库、漏中间状态、识别不到删除。 同一时刻只允许展开一题，避免一口气看完答案。 08 demo —— 可交互模拟 订单表变更流 未开始 ▶ 开始模拟 重置 轮询 定时查表 每 10 分钟一次 延迟高 中间状态丢失 删除难识别 cdc 订阅变更日志 每条变化实时推送 近实时 含删除 只读 binlog 要点： widget 必须和 assets/app.js 里 widgets 注册表的名字对应。 控件逻辑写在 app.js，页面只声明外壳和分栏，两边靠 log 这个 key 对接。 09 summary / raw 一句话总结 cdc 负责把变化 实时通知出来 ； flink 负责 加工变化 。 raw 块直接输出 html，用于一次性的一次性排版实验，不推荐长期使用。 10 写完之后 复制 npm run build # 生成页面 + 首页索引 npm run serve # 本地预览 npm run build:standalone # 额外产出 dist/*.html（单文件，可直接发给别人） 11 自测 什么时候该用 journey 而不是 lane-stack？ lane-stack 描述 结构 （有哪几层、每层是什么）； journey 描述 变化 （同一个东西在每一步长什么样）。 如果重点是「字段从 status=1 变成 '已支付'」，那是 journey。 为什么每页必须带 meta.json 里的 status 和 sources？ 因为漂亮的 html 会自带「这应该是对的」的暗示。 status=draft 会在页面顶部挂黄条，sources 让半年后的你能查证。"},{"slug":"data-warehouse-cdc-flink","text":"数据仓库 vs 数据库 · cdc vs flink 两组最常被混在一起的概念：一个是「业务怎么跑」，一个是「数据怎么分析」；一个是「变化怎么被发现」，一个是「变化怎么被加工」。 数据仓库 cdc flink etl 01 数据库：服务「在线业务」 你平时接触的 mysql、postgresql、mongodb 等，通常说的是 数据库 。 它主要负责保存并支撑 正在发生 的业务操作： 数据库在支撑什么 每一件都要求「立刻写对、立刻查到」 用户注册 用户登录 商品查询 提交订单 支付成功 修改收货地址 例如电商数据库里有这样的表： 复制 users products orders order_items 当用户下单时，后端会往 orders 表插入一条订单；用户查看订单时，又从这个表查询数据。 🎯 数据库的核心目标是： 保证每一笔业务数据正确地写入、修改和查询。 它通常更关注单个用户、单笔订单这类「小范围、高频、低延迟」的读写操作。 02 数据仓库：服务「数据分析和报表」 数据仓库（data warehouse，简称数仓） ，是把来自多个业务系统的数据收集、清洗、统一后， 专门用于分析、报表和商业决策的数据系统。 例如老板或运营会问： 分析类问题 共同点：要扫大量历史数据 今天总销售额多少？ 哪个城市订单最多？ 各渠道下单转化率？ 近 30 天复购率？ 哪个商品退款率最高？ 这类问题需要 扫描、统计大量历史数据 ，不适合直接频繁地在业务数据库上执行。 完整链路：从业务库到看板 整条链路可以拆成 7 层 。左侧是每层的角色，右侧是这一层里真实存在的东西。 layer 01 源系统层 数据真正产生的地方，也是唯一「权威」的副本 mysql 订单库 orders / order_items binlog mysql 用户库 users / user_profile binlog 埋点日志 page_view / click kafka 支付系统 payments / refunds api / db 抽取 extract 把数据从业务库「拿出来」 layer 02 抽取层 决定「多久同步一次」和「能不能拿到删除」 cdc 读 binlog op = insert/update/delete 准实时 时间戳增量 where updated_at ? t+1 / 小时 全量快照 select * 整表拉取 每天一次 日志采集 flume / filebeat 实时 落地 load 先原样存下来，不做业务翻译 ◈ 数仓内部：分层建模 ods → dwd → dws → ads layer 03 ods 贴源层 与业务库表一一对应，只做类型转换 + 按天分区 ods_order 订单原样落地 ods_user 用户原样落地 ods_page_view 埋点原样落地 ods_payment 支付原样落地 清洗 clean 去重 · 补空值 · 剔脏数据 · 统一编码/时区/单位 layer 04 dwd 明细层 一行 = 一个业务事件，字段已翻译成业务语义 dwd_order_detail 订单事件明细（已 join 用户 / 商品） dwd_user_basic 用户基础信息 dwd_pay_flow 支付流水明细 聚合 aggregate 按 日期 / 城市 / 渠道 等维度 group by layer 05 dws 汇总层 一行 = 一个统计口径，明细被压缩成指标 dws_order_city_1d 日 · 城市 · 渠道 的订单与 gmv dws_user_active_1d 日活 / 留存 dws_channel_funnel_1d 渠道转化漏斗 加工 serve 面向某张具体报表定制口径 layer 06 ads 应用层 直接给报表用的结果表，查询毫秒级 ads_gmv_report gmv 大盘 ads_refund_rank 退款率排行 ads_retention 复购 / 留存看板 查询 query bi / 看板 / api 只读结果表，不碰业务库 layer 07 应用层 谁来消费这些数据 bi 报表 固定口径的日报周报 数据看板 实时大盘 即席查询 分析师临时取数 数据 api 反哺业务系统 算法特征 喂给推荐 / 风控模型 🧱 为什么要分这么多层？因为 每一层只解决一个问题 ： ods 保证「拿全了」、dwd 保证「看懂了」、dws 保证「算快了」、ads 保证「用着顺手」。 中间任何一层算错，都能回到上一层重跑，而不用去动业务库。 细节：一行订单数据是怎么被搬走的 上面是宏观分层。下面用一条真实订单（ id = 1001 ）走一遍， 看它在每一层的 数据形态 到底发生了什么变化。 ① 源系统 mysql · orders 只存最终状态 id 1001 user_id 88 status 1 魔法数字 amount 9900 单位：分 updated_at 2024-05-20 10:03:12 业务库只关心「现在是什么」： 没有城市、渠道、会员等级 ， 历史状态会被覆盖，而且这台库不能随便跑大统计。 cdc 订阅 binlog 只传变化的那一行，不扫全表 ② 抽取 binlog event 含 before / after 复制 { op : update , table : orders , before : { id : 1001, status : 1}, // 改之前 after : { id : 1001, status : 2}} // 改之后 拿到 before / after 意味着：既知道「改成了什么」，也知道「哪一行被删了」 —— 这正是轮询做不到的。 原样落地 不翻译业务语义，先存下来 ③ ods ods_order 只加分区字段 id 1001 user_id 88 status 2 amount 9900 updated_at 2024-05-20 10:03:12 dt 2024-05-20 新增分区 只做了 字段类型转换 和 加分区字段 dt ，不做任何业务翻译。 好处是：上游口径改了、或者下游算错了，都能回到这一层原样重跑。 清洗 + 统一 + 关联 枚举翻译 · 单位换算 · 多次 join ④ dwd dwd_order_detail 业务可读 order_id 1001 order_status '已支付' 枚举翻译 amount 99.00 元 分 → 元 city '杭州' join ods_user channel 'app' join 埋点 user_level 'vip' join 用户标签 到这一层， 一行 = 一次订单事件 ，字段已经能被业务直接读懂。 原来要 join 三张表才能回答的问题，现在查一张表就够。 聚合 group by 日期 + 城市 + 渠道 ⑤ dws dws_order_city_1d 明细 → 指标 dt 2024-05-20 city '杭州' channel 'app' order_cnt 1820 gmv 182340.00 一行 1001 的订单，在这里被「溶解」成杭州当天 1820 单里的一份子。 数据量通常会下降 2~3 个数量级 ，但已经无法再还原到单笔订单。 面向看板加工 只留报表要用的字段和口径 ⑥ ads ads_gmv_report 毫秒返回 指标 今日 gmv 值 1,284,930 环比 +12.4% 城市 top1 杭州 看板查询从「扫几亿行明细」变成「读几千行结果」，所以能秒开。 代价是这张表 只服务于这一个口径 ，换一个问法就要再建一张。 抽取方式怎么选 「怎么把数据拿出来」是整条链路里最关键的一步。常见有 5 种做法，差别主要在 延迟 、 能不能感知删除 、 对业务库的压力 。 方式 怎么做 延迟 删除 压力 适用 全量快照 每天 select * 整表拉一遍 t+1 能 高 小表、维表 时间戳增量 where updated_at 上次时间 分钟 ~ 小时 不能 中 有 update_time 的表 自增 id 增量 where id 上次最大 id 分钟 ~ 小时 不能（改也漏） 中 只追加的流水表 触发器 建 trigger 写影子表 秒级 能 高（写放大） 老系统兜底 cdc 读 binlog 订阅数据库变更日志，只读不写 秒级 / 准实时 能 低 现在的主流方案 数据仓库存储的是经过处理、适合分析的数据；它通常面向报表、仪表盘和商业智能场景。 03 最核心的区别 维度 数据库 数据仓库 主要目的 支撑线上业务 数据分析、报表、决策 典型操作 下单、支付、修改资料 统计 gmv、转化率、复购率 数据来源 往往是一个业务系统 通常汇集多个业务系统 数据范围 当前业务数据为主 大量历史数据 数据形态 更贴近原始业务表 清洗、统一、汇总后的分析数据 查询特点 查一位用户、一笔订单 查全量，按天 / 月 / 地区 / 渠道聚合 使用者 后端服务、业务系统 数据分析师、运营、管理者、bi 系统 是否直接承接用户请求 是 通常不是 04 数据怎么流动 同样的订单数据，两条完全不同的路径。 写入路径 用户下单 —— 这应该直接写业务数据库，而不是直接写数据仓库 前端 后端服务 mysql orders 表 分析路径 今日成交额实时大盘 —— 走异步链路，不碰业务库 订单数据 cdc / 消息队列 flink 数据仓库 / 实时分析库 大盘 05 一个容易混淆的点 💡 数据仓库 不一定是某个固定产品 ，而是一类用途 / 架构。 例如这些产品可能被用作数仓或数仓中的查询引擎： 常见选择 它们不都是「数仓」，但都可以充当数仓或数仓里的查询引擎 clickhouse apache doris starrocks snowflake bigquery "}]</script>

      var tags = (c.getAttribute('data-tags') || '').split(',').filter(Boolean);
      var okTag = activeTags.size === 0 || tags.some(function (t) { return activeTags.has(t); });
      var okTerm = !term || (byslug[slug] || '').indexOf(term) !== -1;
      var show = okTag && okTerm;
      c.hidden = !show;
      if (show) shown++;
    });
    count.textContent = shown;
    empty.hidden = shown !== 0;
  }

  q.addEventListener('input', apply);

  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    var t = b.getAttribute('data-tag');
    if (activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
    b.classList.toggle('on', activeTags.has(t));
    apply();
  });

  document.getElementById('themeBtn').addEventListener('click', function () {
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('kh-theme', next); } catch (e) {}
  });

  // 复用页面级的主题偏好
  try {
    var saved = localStorage.getItem('kh-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>
</body>
</html>
