# 嵌套产物树 —— 操作系统的进程管理
#
# 这是这棵树的唯一真相源：
#   · 首页用它渲染树视图
#   · 每篇笔记的前置区块从 needs 生成
#   · 笔记的 meta.json 只写 { tree: { topic, id } }，其余不重复维护
#
# 这棵树和 sql-builder-v2 / insight 那两棵的区别：
#   那两棵读的是**具体代码**（一个库、一个应用）
#   这棵读的是**教材级原理** —— 「进程/线程/调度」本来就是相互支撑的一组概念
#
# 顺序是这样定的：
#   进程是底座（状态、数据结构、切换开销）→ 线程建在它上面（共享什么、切换便宜在哪）
#   调度是「谁来挑下一个」—— 它依赖进程的状态定义，不依赖线程
#   所以 线程 和 调度 都只 needs 进程，彼此不依赖
#
# 后四篇是另一条线 —— 从「是什么」转成「为什么是这样」：
#   为什么会有这个抽象（反推：不要它会出什么事）
#   -> 内核里它长什么样（只有一种对象，共享是逐资源开关）
#   -> 怎么统一理解（资源域 × 执行流，一把尺子）
#   -> 怎么用到工程上（不背口诀，走检查顺序）
#   这条线读不读前三篇都成立，但先读前三篇会更顺

