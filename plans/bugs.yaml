# 嵌套产物树 —— Bug 复盘集
#
# 这个分类专门收「真实发生过的 bug」。
# 和别的树不一样：它不是「理解一个系统」，而是「一个坑为什么会被踩」。
#
# 每篇的统一结构（照这个顺序写，读者扫一遍就知道结论）：
#   01 症状        谁看到了什么，为什么三方都说自己没错
#   02 链路        完整走一遍，指出坏点落在第几环
#   03 机制        坏点的真实实现（贴源码，不靠猜）
#   04 为什么这么设计  这个机制本身要解决什么问题，代价是什么
#   05 为什么活了很久  盲区清单（哪条才是根因级别）
#   06 修法与防线    diff + 三道防线 + 真正能防住它的那条测试
#   07 速查        一句话 + 判断表
#   08 自测        4 题，覆盖「换名字会不会变」这类反直觉点
#
# 字段说明：
#   id        节点标识，needs 里引用它
#   title     显示名（首页树 + 前置区块都用它）
#   layer     这一段属于问题链的哪一环：症状 / 根因 / 推广
#   needs     前置节点的 id —— 理解本节点之前必须先理解谁
#   artifact  对应的笔记 slug
#   status    planned 未开工 / drafted 有内容 / done 已定稿
#   blurb     一句话说明（首页树上显示）
#   children  子节点，递归
#
# 新加一个 bug：slug 用 bug-<一句话>，节点 id 用短名，layer 填「根因」，
# 在 summary 里写清「哪个系统的哪一环」，别写成「xx 功能有问题」这种没有落点的标题。

topic: bugs
