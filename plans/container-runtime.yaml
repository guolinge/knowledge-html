# 嵌套产物树 —— 容器到底是用什么做出来的
#
# 这棵树是「从结构到机制」的一条链：
#   ① 先知道一台机器上有什么（已写）
#   ② 再看「隔离」这个机制到底在做什么
#   ③ 最后看「限额」这个机制
#
# ②③ 都只 needs ①，因为它们彼此不依赖 —— 是同一层的两个机制，
# 谁也不比谁先。但两篇合起来才是①里那句
# 「容器 = 一个进程 + 一组 namespace + 一个 cgroup + 一个 rootfs」。

topic: container-runtime
title: 理解容器到底是怎么做出来的
summary: 从「一台机器上有什么」，到「隔离」和「限额」这两个机制各自在做什么 —— 容器不是什么新东西，是内核里现成的几样机制拼出来的
source: 飞书文档《管道，共享内存，消息队列》同系列；机制部分核实自 kernel.org cgroup-v2 与 man7 namespace 文档

