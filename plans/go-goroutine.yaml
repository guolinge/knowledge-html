# 嵌套产物树 —— Go 协程
#
# 这是这棵树的唯一真相源：
#   · 首页用它渲染树视图
#   · 每篇笔记的前置区块从 needs 生成
#   · 笔记的 meta.json 只写 { tree: { topic, id } }，其余不重复维护
#
# 这棵树怎么定的：
#   原文的主线是一句：一条执行流，如何被从内核里一步步「拆轻」。
#   所以这棵树是一条链，不是一张网 —— 每一篇都在拆上一层的重量。
#
#   读者：没写过 Go，但懂线程 / Node / JVM 的并发模型。
#   目标：读完能讲清调度器怎么转、能顺着 runtime 源码读、能排查泄漏和变慢。
#
#   ① 称重             一条执行流由什么构成、线程切换与栈预留贵在哪
#   ② 前人怎么死的      1:1 的三堵墙、旧 M:N 的连坐、async/await 的颜色
#   ③ G 是什么          拆出来的这个任务，和函数/线程/进程各是什么关系
#   ④ G 挂回线程        GMP 三件套：谁持有谁、P 为什么存在、GOMAXPROCS 是什么
#   ⑤ 阻塞了怎么办      网络走 netpoller，真阻塞走 hand-off —— 两条路的分界线
#   ⑥ 调度器怎么挑      队列、窃取、runnext、两次抢占
#   ⑦ 工程判断          泄漏、版本敏感、排障入口、什么时候不该开
#
#   ⑤⑥ 都只 needs ④（它们各自回答一个不同的问题：阻塞怎么办 / 挑谁跑）
#   ⑦ needs ④⑤（排障要同时用到调度与阻塞两条链路）

topic: go-goroutine
title: 理解 Go 协程
summary: 内核只认识进程和线程，Go 却造出了第三种「看起来会阻塞、实际不阻塞」的执行流 —— 一条执行流被拆轻的全过程
source: 飞书文档《从进程线程理解 Go 协程》 @ revision 105；事实核对 Go 1.26.2 源码与本机实测（2026-10-20）

