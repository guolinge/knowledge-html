# 嵌套产物树 —— Go 协程
#
# 这是这棵树的唯一真相源：
#   · 首页用它渲染树视图
#   · 每篇笔记的前置区块从 needs 生成
#   · 笔记的 meta.json 只写 { tree: { topic, id } }，其余不重复维护
#
# 这棵树怎么定的：
#   原文的主线是一句：一条执行流，如何被从内核里一步步「拆轻」。
#   所以这棵树是一条链，不是一张网 —— 每一篇都在拆上一层的重量。
#
#   ① 称重             一条执行流由什么构成、线程切换到底贵在哪
#   ② 前人怎么死的      为什么「一任务一线程」不成立，旧 M:N 与 async/await 各栽在哪
#   ③ G 是什么          拆出来的这个新东西，和线程/进程各占哪一层
#   ④ G 挂回线程        GMP 三件套：谁调度谁、谁持有谁
#   ⑤ 阻塞了怎么办      这是 Go 能复兴 M:N 的真正核心，也是原文的重点
#   ⑥ 调度器怎么挑     队列、窃取、抢占
#   ⑦ 工程判断          什么时候该开、会踩什么坑
#
#   ⑤⑥ 都只 needs ④（它们各自回答一个不同的问题：阻塞怎么办 / 挑谁跑）
#   ⑦ needs ④⑤（选型矩阵里的「高等待」那一格，正是 netpoller 的地盘）

topic: go-goroutine
