# 嵌套产物树 —— 操作系统的文件系统
#
# 这是这棵树的唯一真相源：
#   · 首页用它渲染树视图
#   · 每篇笔记的前置区块从 needs 生成
#   · 笔记的 meta.json 只写 { tree: { topic, id } }，其余不重复维护
#
# 这棵树怎么定的：
#   ① 是底座 —— 一个文件在操作系统里到底由哪几样东西组成（inode / 目录项 / 数据块）
#   其余四篇都 needs ①，因为它们全都在「动」那几样东西
#
#   ② 和 ⑥ 是一条线：② 讲「一次 open/write 怎么穿过 VFS 落到磁盘」，
#   ⑥ 讲「这次读写到底等不等」—— 不先知道路径有几层，就说不清在哪一层等
#
#   ③ 和 ④ 是一条线：③ 讲「一个文件的数据块怎么记下来」，
#   ④ 讲「新块去哪找、整个文件系统怎么切成块组」—— 一正一反
#
#   ⑤ 单独一条：目录本身也是文件，链接是在目录项层做的手脚

topic: os-file-system
title: 理解文件系统
summary: 断电之后数据还在，靠的是磁盘上那套记账结构 —— inode 记元信息、目录项记名字、数据块记内容，三者被 VFS 串成「一切皆文件」
source: 飞书文档《一口气搞懂「文件系统」，就靠这 25 张图了》 @ revision 105

