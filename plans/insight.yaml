# 嵌套产物树 —— 客群洞察
#
# 这是这棵树的唯一真相源：
#   · 首页用它渲染树视图
#   · 每篇笔记的前置区块从 needs 生成
#   · 笔记的 meta.json 只写 { tree: { topic, id } }，其余不重复维护
#
# 字段说明：
#   id        节点标识，needs 里引用它
#   title     显示名（首页树 + 前置区块都用它）
#   layer     六层里的哪一层：概念 / 组织 / 架构 / 模块
#   needs     前置节点的 id —— 理解本节点之前必须先理解谁
#   artifact  对应的笔记 slug（还没写就留空）
#   status    planned 未开工 / drafted 有内容 / done 已定稿
#   blurb     一句话说明（首页树上显示）
#   children  子节点，递归
#
# 这棵树和 sql-builder-v2 那棵的区别：
#   sql-builder-v2 读的是**上游代码**（sources/gitlab 里的库）
#   这棵读的是**本仓库的实现**（crm-dsl-stru 自己的 apps/packages）
#
# 顺序是一条「从界面往下钻」的路：
#   配置层 → 数据层 → 编译层 → 异步层

topic: insight
title: 理解客群洞察
summary: 从界面一路往下钻 —— 配置怎么变成界面、底下有哪些表和一次查询怎么走、条件怎么编成 SQL、名单怎么异步冻起来
source: crm-dsl-stru（本机跑起来的实例，全部数字实测）

nodes:
  - id: admin
    title: 配置层
    layer: 概念
    needs: []
    artifact: data-admin-to-ui
    status: drafted
    blurb: Data Admin 改一行 MySQL，界面跟着变
    children:
      - id: admin-schema
        title: 配置表结构
        layer: 组织
        needs: [admin]
        artifact: data-admin-schema
        status: drafted
        blurb: 8 张配置表分成三条线、9 条引用 0 个外键、同一批表读成三种投影
        children:
          - id: admin-relation
            title: 关系与属性
            layer: 架构
            needs: [admin-schema]
            artifact: data-admin-relation
            status: drafted
            blurb: 一行关系带客体、属性行靠 relation_id 认亲，怎么决定界面上的三块和那个「+ 添加属性」
            children: []

  - id: combination
    title: 组件层
    layer: 模块
    needs: [admin]
    artifact: combination-overview
    status: drafted
    blurb: 受控的圈选组件包：Metadata 驱动渲染，草稿收窄成 DSL
    children:
      - id: combination-mechanics
        title: 组件机制
        layer: 架构
        needs: [combination, dsl]
        artifact: combination-mechanics
        status: drafted
        blurb: 受控数据流、幽灵行与 convert、控件决策、候选值管道、buildQuery 检查清单
        children: []

  - id: data-map
    title: 数据层
    layer: 组织
    needs: [admin]
    artifact: insight-data-map
    status: drafted
    blurb: 15 张表、每张的关键列、一次查询的完整旅程
    children: []

  - id: dsl
    title: 编译层
    layer: 架构
    needs: [data-map]
    artifact: insight-dsl
    status: drafted
    blurb: 条件树怎么一行行变成 SQL
    children:
      - id: dsl-steps
        title: 编译契约（方案 4.3）
        layer: 架构
        needs: [data-map]
        artifact: sql-builder-steps
        status: drafted
        blurb: Validate / Resolve / Compile / Assemble 四步，每步吃什么、吐什么
        children: []
      - id: sql-structure-value
        title: 结构 vs 值
        layer: 架构
        needs: [dsl]
        artifact: sql-structure-vs-value
        status: drafted
        blurb: 哪些是结构、哪些是值；注入是从哪条线越过去的
        children: []

  - id: snapshot
    title: 异步层
    layer: 模块
    needs: [data-map, dsl]
    artifact: snapshot-lifecycle
    status: drafted
    blurb: 一次「冻名单」的完整生命周期（七个状态 + 三个 worker）
    children: []
