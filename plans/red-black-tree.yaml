# 嵌套产物树 —— 理解红黑树
#
# 这棵树怎么定的：
#   红黑树难，不在于实现，而在于那五条性质看着像凭空规定。
#   真正让它讲得通的只有一件事：==红黑树是 2-3-4 树的二叉写法==。
#   所以这棵树是一条链：先把「为什么需要平衡」和「多键节点这个模型」讲清楚，
#   再把五条性质翻译成这个模型的语言，插入和删除就只是同一套动作的两种情形。
#
#   ① 为什么会坏      BST 的代价由树高决定，有序插入会把它拉成一条链
#   ② 多键节点        2-3-4 树：一个节点装 2~3 个键，天生所有叶子同深
#   ③ 五条性质的来历   红黑树的规则 = 2-3-4 树的二叉编码；高度上限的推导；旋转在做什么
#   ④ 插入            新键染红，三种情形：叔红变色上推 / 叔黑同侧一转 / 叔黑折线两转
#   ⑤ 删除            双黑与四种情形（兄弟红 / 兄弟黑两黑子 / 近侄红 / 远侄红）
#   ⑥ 工程里的取舍     为什么 Linux、Java、C++ 都选它：与 AVL、B 树、跳表的差别
#
#   ④⑤ 都需要 ③ 的规则和 ② 的模型；⑤ 另需 ④ 里建立的「红边搬家」直觉。
#   ⑥ 最后写：它引用的旋转次数上限来自 ④⑤。

topic: red-black-tree
title: 理解红黑树
summary: 一棵规则看着很古怪的二叉搜索树，其实是 2-3-4 树的另一种写法 —— 从 BST 退化讲到工程取舍
source: >-
  事实依据以 CLRS《算法导论》红黑树章节与 Sedgewick 的 2-3-4 / LLRB
  讲法为准，逐条列在每篇 meta.json 的 sources

