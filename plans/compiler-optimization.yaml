# 嵌套产物树 —— 理解代码优化
#
# 这棵树怎么定的：
#   优化这件事的难，不在「知道多少条规则」，而在三件互相拉扯的事：
#   变换必须正确（否则是错编译），必须有收益（否则白花时间），还得在真实机器和真实输入上成立。
#   所以先讲底线（不给证明就不动手），再讲收益从哪来（测量与阿姆达尔），
#   然后拆开编译器为此搭的公共设施（表示与分析），再看它怎么用成本模型挑选变换与顺序，
#   最后回到闭环：用真实运行信息和测试把「看起来更快」变成「确实更快、且仍然正确」。
#
#   ① 底线      合法性 / 收益性分开判断；as-if 的可观察行为清单；保守近似
#   ② 收益      先测量再优化；阿姆达尔；算法优先；热点路径；局部性
#   ③ 设施      IR、基本块、CFG、支配、SSA、别名、循环信息、规范化 —— 用表示换算法复杂度
#   ④ 选择      强度削弱、循环五件套、成本模型、pass 顺序
#   ⑤ 闭环      PGO/JIT、测量-变换-验证、测试体系、程序员与编译器的分工
#
#   ③ 是 ④ 的前置：成本模型要拿分析结果算收益，pass 顺序讲的也是这些 pass。
#   ① 是全部的前置：任何变换先过合法性这一关。② 与 ③④⑤ 可以分开读。

topic: compiler-optimization
