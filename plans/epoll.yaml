# 嵌套产物树 —— 理解 epoll
#
# 这条树的唯一判据是同一个问题：**「等」这件事，由谁来承载？**
#
#   阻塞 read      等的人 = 一个线程（要占一个执行单位，还要被调度）
#   忙轮询          等的人 = 还是那个线程，只是它没停（烧 CPU 换「不用睡」）
#   select / poll   等的人 = 一个线程，内核替它在 N 个等待队列上挂了 N 个临时条目
#   epoll           等的人 = 一段回调（挂在同一个等待队列上，不需要被调度）
#
# 所以「epoll 更快」具体指的是：**通知到达时，需要被调度唤醒的对象从「线程」变成了「链表节点」**。
# 这个说法要成立，前提是读者先看懂两件事：
#   · 阻塞 read 到底把什么挂到了哪里（② 的等待队列）
#   · 一个线程在等的时候，占着的到底是什么（③）
# 这两件讲完，④ 的「临时条目」和 ⑤ 的「常驻回调」才有对比对象。
#
# 两条边界：
#   · 前面接 fs-vfs-layers（fd 与打开文件表）—— 这里只用到「fd 是一个下标」这层，不重讲
#   · 后面接 goroutine-poller（让执行单位变轻）—— 本树只解决「让等待不占执行单位」

topic: epoll
title: 理解 epoll
