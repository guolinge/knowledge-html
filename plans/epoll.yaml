# 嵌套产物树 —— 理解 epoll
#
# 主线是一句话：**「等待」是怎么从「执行」里剥出来的。**
#
# 这句话不是修辞，它是这棵树唯一的判据：
#   每剥掉一层，就少一点「因为要等而必须占着的执行资源」。
#   线程占用 → 一次问一遍（不再占线程，但问本身有成本）→ 内核记住名单（问的成本不再随连接数涨）
#
# 两条边界：
#   · 前面接 fs-vfs-layers（fd / 打开文件表）和 fs-io-models（等在哪一段、同步异步的分界）
#     —— 这两层已经有笔记了，这里**接上，不重讲**
#   · 后面接 go-goroutine 树的 goroutine-poller
#     —— 那篇讲的是同一件事的另一半（让「执行单位」变轻），epoll 讲的是「让等待不占执行单位」
#
# ⓪ 是引子：从「你写的那段代码」出发，先看清哪些东西是一份、哪些是 N 份 ——
# 尤其「线程不会复制代码」这件事，不讲清它，后面「一万条连接要一万个线程」就无从谈起。
# ①② 是前提：先知道一条连接在内核里是什么、为什么它会「等」，
# 再说清「一连接一线程」到底亏在哪（不是内存，是拿执行资源去承载等待）。
# ③ 是这一篇的锤子：轮询把「等」换成「问」，一个线程终于能招呼多个连接了 ——
# 但它自己有两个病，而且这两个病才是后面 epoll 存在的理由。
# ④⑤ 是 epoll 的正身：先列需求，再看它怎么给；
# 然后把「就绪」这个词抠开 —— 大多数讲 epoll 的材料都跳过这一步，
# 而 LT/ET 讲不清，全都是因为没讲「接收缓冲区」。
# ⑥ 收尾：它治好了什么、没治什么。

