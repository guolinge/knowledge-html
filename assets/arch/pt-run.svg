        <text x="100" y="221" class="t-cloud" font-size="9" font-weight="600">内核 · 调度与等待</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="2" x="92" y="378" width="1116" height="153" rx="12" class="c-region" stroke-width="1"/>
        <text x="100" y="396" class="t-cloud" font-size="9" font-weight="600">硬件</text>

