<svg viewBox="0 0 1248 599" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">谁在什么时候跑：状态是任务挂在哪个队列上的投影</title>
        <desc id="archify-diagram-description">调度器在两条队列之间搬任务 —— 排在运行队列里的才有资格上核</desc>
