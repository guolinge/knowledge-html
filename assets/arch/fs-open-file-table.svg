<svg viewBox="0 0 758 658" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">文件描述符、打开文件表、inode 三层</title>
        <desc id="archify-diagram-description">两个进程打开同一个文件，各自的偏移量是分开的，指向的 inode 是同一个</desc>
