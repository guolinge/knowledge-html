        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="1" x="30" y="206" width="688" height="384" rx="12" class="c-region" stroke-width="1"/>
        <text x="38" y="224" class="t-cloud" font-size="9" font-weight="600">内核维护：全局打开文件表 + inode</text>

