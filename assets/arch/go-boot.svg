        <path data-edge-from="rt" data-edge-to="ps" data-edge-label="建 P 池" data-edge-key="2" data-edge-id="rt-ps" data-composition-points="623,370;623,425;570,425;570,480" d="M 623 370 L 623 417 Q 623 425 615 425 L 578 425 Q 570 425 570 433 L 570 480" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
