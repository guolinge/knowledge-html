        <text x="18" y="218" class="t-cloud" font-size="9" font-weight="600">一个 Go 进程 · 用户态</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="1" data-frame-members="kern" x="10" y="20" width="1180" height="160" rx="12" class="c-region" stroke-width="1"/>
        <text x="18" y="38" class="t-cloud" font-size="9" font-weight="600">内核态</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path data-edge-from="kern" data-edge-to="m0" data-edge-label="exec 交出的那条线程" data-edge-key="0" data-edge-id="kern-m0" data-composition-points="600,150;600,190;190,190;190,230" d="M 600 150 L 600 182 Q 600 190 592 190 L 198 190 Q 190 190 190 198 L 190 230" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
