<svg viewBox="0 0 1200 690" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">main 跑起来之前，进程里已经站着谁</title>
        <desc id="archify-diagram-description">内核只交出一条线程；M0、g0、P 池、main G 都是 runtime 在这条线程上顺手搭出来的</desc>
