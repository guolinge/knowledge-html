        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="1" x="176" y="256" width="638" height="100" rx="12" class="c-region" stroke-width="1"/>
        <text x="184" y="274" class="t-cloud" font-size="9" font-weight="600">inode</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="2" x="176" y="446" width="678" height="120" rx="12" class="c-region" stroke-width="1"/>
        <text x="184" y="464" class="t-cloud" font-size="9" font-weight="600">这块 inode 指向的东西</text>

