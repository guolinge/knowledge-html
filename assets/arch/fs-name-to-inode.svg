<svg viewBox="0 0 894 634" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">一个名字最终指向什么</title>
        <desc id="archify-diagram-description">硬链接是「另一个名字指同一个 inode」，软链接是「另起一个 inode」—— 这两句话的区别在这张图上</desc>
        <!-- Definitions -->
