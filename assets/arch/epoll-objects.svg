<svg viewBox="0 0 876 614" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">一个 fd 从「登记」到「就绪」，中间走了哪些对象</title>
        <desc id="archify-diagram-description">两张表是结果，这张图是过程 —— 关键是那个回调挂在哪儿</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
