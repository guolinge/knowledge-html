        <path data-edge-from="rbtree" data-edge-to="waitq" data-edge-label="挂一个回调" data-edge-key="2" data-edge-id="e3" data-composition-points="715,126;715,260" d="M 715 126 L 715 260" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="waitq" data-edge-to="ready" data-edge-label="回调触发 → 挂进就绪表" data-edge-key="3" data-edge-id="e4" data-composition-points="620,288;520,288" d="M 620 288 L 520 288" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
