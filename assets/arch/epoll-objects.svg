        <text x="42" y="62" class="t-cloud" font-size="9" font-weight="600">你的进程</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="1" x="304" y="44" width="532" height="292" rx="12" class="c-region" stroke-width="1"/>
        <text x="312" y="62" class="t-cloud" font-size="9" font-weight="600">内核</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="2" x="594" y="444" width="242" height="102" rx="12" class="c-region" stroke-width="1"/>
