        <text x="648" y="118" class="t-cloud" font-size="9" font-weight="600">容器 B</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="2" x="6" y="76" width="1058" height="270" rx="12" class="c-region" stroke-width="1"/>
        <text x="14" y="94" class="t-cloud" font-size="9" font-weight="600">这台机器</text>

