<svg viewBox="0 0 1200 560" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">两个容器：哪些是自己的，哪些是同一份</title>
        <desc id="archify-diagram-description">同一个 Pod 里的两个容器 —— 各复制一份的是 PID 和 MNT，共用一份的是 NET 和 IPC</desc>
        <!-- Definitions -->
        <defs>
