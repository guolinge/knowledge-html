        <title id="archify-diagram-title">Ext2 在硬盘上的样子：引导块 + 一堆块组</title>
        <desc id="archify-diagram-description">每个块组都长一样，因为文件系统被切成了重复的小单元 —— 这样 inode 和数据块才能靠得近</desc>
