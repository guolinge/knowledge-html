<svg viewBox="0 0 1048 632" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">一圈轮询，在机器上经过谁</title>
        <desc id="archify-diagram-description">左边是进程里的线程和名单，右边是内核里的 socket；流程用下面的「导览」走</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="0" x="92" y="272" width="306" height="272" rx="12" class="c-region" stroke-width="1"/>
        <text x="100" y="290" class="t-cloud" font-size="9" font-weight="600">你的进程 · 用户态</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="1" x="672" y="52" width="336" height="512" rx="12" class="c-region" stroke-width="1"/>
        <text x="680" y="70" class="t-cloud" font-size="9" font-weight="600">内核</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path data-edge-from="thread" data-edge-to="lsock" data-edge-label="① accept：有新连接吗" data-edge-key="0" data-edge-id="a1" data-composition-points="120,332;96,332;96,112;700,112" d="M 120 332 L 104 332 Q 96 332 96 324 L 96 120 Q 96 112 104 112 L 700 112" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="lsock" data-edge-to="accq" data-edge-label="握手完成的连接排在这" data-edge-key="1" data-edge-id="a2" data-composition-points="840,144;840,210" d="M 840 144 L 840 210" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
        <path data-edge-from="thread" data-edge-to="list" data-edge-label="新 fd 设上 O_NONBLOCK → 进名单" data-edge-key="2" data-edge-id="a3" data-composition-points="245,364;245,460" d="M 245 364 L 245 460" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="thread" data-edge-to="crest" data-edge-label="② read：EAGAIN" data-edge-key="3" data-edge-id="a4" data-composition-points="370,325;535,325;535,372;700,372" d="M 370 325 L 527 325 Q 535 325 535 333 L 535 364 Q 535 372 543 372 L 700 372" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="thread" data-edge-to="c3" data-edge-label="② read：200 字节" data-edge-key="4" data-edge-id="a6" data-composition-points="370,339;535,339;535,512;700,512" d="M 370 339 L 527 339 Q 535 339 535 347 L 535 504 Q 535 512 543 512 L 700 512" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Components -->
        <g id="node-thread" data-node-id="thread" data-node-label="主线程" tabindex="0" role="button" aria-label="Focus 主线程, 进程自带的 · 没有 pthread_create, 你的进程 · 用户态" aria-pressed="false" data-node-kind="backend" data-node-sublabel="进程自带的 · 没有 pthread_create" data-node-context="你的进程 · 用户态">
          <title>主线程 · 进程自带的 · 没有 pthread_create · 你的进程 · 用户态</title>
          <rect x="120" y="300" width="250" height="64" rx="6" class="c-mask"/>
          <rect x="120" y="300" width="250" height="64" rx="6" class="c-backend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(126 306) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-detail-anchor x="245" y="330" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">主线程</text>
        <text data-detail="context" x="245" y="346" class="t-muted" font-size="9" text-anchor="middle">进程自带的 · 没有 pthread_create</text>
        </g>

        <g id="node-list" data-node-id="list" data-node-label="你的数组 fds[]" tabindex="0" role="button" aria-label="Focus 你的数组 fds[], accept 进来的连接都记在这, 你的进程 · 用户态" aria-pressed="false" data-node-kind="backend" data-node-sublabel="accept 进来的连接都记在这" data-node-context="你的进程 · 用户态">
          <title>你的数组 fds[] · accept 进来的连接都记在这 · 你的进程 · 用户态</title>
          <rect x="120" y="460" width="250" height="64" rx="6" class="c-mask"/>
          <rect x="120" y="460" width="250" height="64" rx="6" class="c-backend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(126 466) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-detail-anchor x="245" y="490" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">你的数组 fds[]</text>
        <text data-detail="context" x="245" y="506" class="t-muted" font-size="9" text-anchor="middle">accept 进来的连接都记在这</text>
        </g>

        <g id="node-lsock" data-node-id="lsock" data-node-label="监听 socket · 非阻塞" tabindex="0" role="button" aria-label="Focus 监听 socket · 非阻塞, 0.0.0.0:80 · 它只管接新连接, 内核" aria-pressed="false" data-node-kind="database" data-node-sublabel="0.0.0.0:80 · 它只管接新连接" data-node-context="内核">
          <title>监听 socket · 非阻塞 · 0.0.0.0:80 · 它只管接新连接 · 内核</title>
          <rect x="700" y="80" width="280" height="64" rx="6" class="c-mask"/>
          <rect x="700" y="80" width="280" height="64" rx="6" class="c-database" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(706 86) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-detail-anchor x="840" y="110" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">监听 socket · 非阻塞</text>
        <text data-detail="context" x="840" y="126" class="t-muted" font-size="9" text-anchor="middle">0.0.0.0:80 · 它只管接新连接</text>
        </g>

        <g id="node-accq" data-node-id="accq" data-node-label="accept 队列" tabindex="0" role="button" aria-label="Focus accept 队列, 握手完成的连接在这排队, 内核" aria-pressed="false" data-node-kind="database" data-node-sublabel="握手完成的连接在这排队" data-node-context="内核">
          <title>accept 队列 · 握手完成的连接在这排队 · 内核</title>
          <rect x="700" y="210" width="280" height="64" rx="6" class="c-mask"/>
          <rect x="700" y="210" width="280" height="64" rx="6" class="c-database" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(706 216) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-detail-anchor x="840" y="240" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">accept 队列</text>
        <text data-detail="context" x="840" y="256" class="t-muted" font-size="9" text-anchor="middle">握手完成的连接在这排队</text>
        </g>

        <g id="node-crest" data-node-id="crest" data-node-label="连接 1 · 连接 2 · ……" tabindex="0" role="button" aria-label="Focus 连接 1 · 连接 2 · ……, 缓冲区都是空的 → 一律 EAGAIN, 内核" aria-pressed="false" data-node-kind="database" data-node-sublabel="缓冲区都是空的 → 一律 EAGAIN" data-node-context="内核">
          <title>连接 1 · 连接 2 · …… · 缓冲区都是空的 → 一律 EAGAIN · 内核</title>
          <rect x="700" y="340" width="280" height="64" rx="6" class="c-mask"/>
          <rect x="700" y="340" width="280" height="64" rx="6" class="c-database" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(706 346) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-detail-anchor x="840" y="370" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">连接 1 · 连接 2 · ……</text>
        <text data-detail="context" x="840" y="386" class="t-muted" font-size="9" text-anchor="middle">缓冲区都是空的 → 一律 EAGAIN</text>
        </g>

        <g id="node-c3" data-node-id="c3" data-node-label="连接 3 · socket" tabindex="0" role="button" aria-label="Focus 连接 3 · socket, 缓冲区有 200 字节, 内核" aria-pressed="false" data-node-kind="database" data-node-sublabel="缓冲区有 200 字节" data-node-context="内核">
          <title>连接 3 · socket · 缓冲区有 200 字节 · 内核</title>
          <rect x="700" y="480" width="280" height="64" rx="6" class="c-mask"/>
          <rect x="700" y="480" width="280" height="64" rx="6" class="c-database" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(706 486) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-detail-anchor x="840" y="510" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">连接 3 · socket</text>
        <text data-detail="context" x="840" y="526" class="t-muted" font-size="9" text-anchor="middle">缓冲区有 200 字节</text>
        </g>

        <!-- Connection labels -->
        <g data-detail="context" data-edge-from="thread" data-edge-to="lsock" data-edge-label="① accept：有新连接吗" data-edge-key="0" data-edge-id="a1">
          <rect x="43" y="202" width="106" height="14" rx="3" class="c-mask"/>
          <text x="96" y="212" class="t-muted" font-size="8" text-anchor="middle">① accept：有新连接吗</text>
        </g>
        <g data-detail="context" data-edge-from="lsock" data-edge-to="accq" data-edge-label="握手完成的连接排在这" data-edge-key="1" data-edge-id="a2">
          <rect x="787" y="148" width="106" height="14" rx="3" class="c-mask"/>
          <text x="840" y="158" class="t-messagebus" font-size="8" text-anchor="middle">握手完成的连接排在这</text>
        </g>
        <g data-detail="context" data-edge-from="thread" data-edge-to="list" data-edge-label="新 fd 设上 O_NONBLOCK → 进名单" data-edge-key="2" data-edge-id="a3">
          <rect x="168" y="368" width="154" height="14" rx="3" class="c-mask"/>
          <text x="245" y="378" class="t-muted" font-size="8" text-anchor="middle">新 fd 设上 O_NONBLOCK → 进名单</text>
        </g>
        <g data-detail="context" data-edge-from="thread" data-edge-to="crest" data-edge-label="② read：EAGAIN" data-edge-key="3" data-edge-id="a4">
          <rect x="496.4" y="320.5" width="77.2" height="14" rx="3" class="c-mask"/>
          <text x="535" y="330.5" class="t-muted" font-size="8" text-anchor="middle">② read：EAGAIN</text>
        </g>
        <g data-detail="context" data-edge-from="thread" data-edge-to="c3" data-edge-label="② read：200 字节" data-edge-key="4" data-edge-id="a6">
          <rect x="491.6" y="413.5" width="86.8" height="14" rx="3" class="c-mask"/>
          <text x="535" y="423.5" class="t-backend" font-size="8" text-anchor="middle">② read：200 字节</text>
        </g>

        <!-- Legend -->
        <g data-legend data-legend-bridge>
          <text x="40" y="596" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="backend" data-legend-kind="backend" data-legend-label="Backend" data-legend-x="40" data-legend-baseline="616" data-legend-width="78">
            <rect x="40" y="607" width="16" height="10" rx="2.5" class="c-backend" stroke-width="1"/>
            <text x="62" y="616" class="t-muted" font-size="10" font-weight="500">Backend</text>
          </g>
          <g data-legend-semantic-kind="database" data-legend-kind="database" data-legend-label="Database" data-legend-x="140" data-legend-baseline="616" data-legend-width="83">
            <rect x="140" y="607" width="16" height="10" rx="2.5" class="c-database" stroke-width="1"/>
            <text x="162" y="616" class="t-muted" font-size="10" font-weight="500">Database</text>
          </g>
        </g>
      </svg>