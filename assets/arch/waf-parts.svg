<svg viewBox="0 0 1280 700" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">四样东西：环境、脚本、cookie、判定</title>
        <desc id="archify-diagram-description">挑战脚本没有自己的答案，它算的就是左边这个环境</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="0" data-frame-members="browser challenge jar" x="10" y="120" width="630" height="510" rx="12" class="c-region" stroke-width="1"/>
        <text x="18" y="138" class="t-cloud" font-size="9" font-weight="600">浏览器进程</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="1" data-frame-members="waf" x="690" y="120" width="300" height="290" rx="12" class="c-region" stroke-width="1"/>
        <text x="698" y="138" class="t-cloud" font-size="9" font-weight="600">站点边缘</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="2" data-frame-members="api" x="1010" y="140" width="250" height="250" rx="12" class="c-region" stroke-width="1"/>
        <text x="1018" y="158" class="t-cloud" font-size="9" font-weight="600">源站</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path data-edge-from="waf" data-edge-to="challenge" data-edge-label="② 下发这段 JS" data-edge-key="0" data-edge-id="e1" data-composition-points="720,265;610,265" d="M 720 265 L 610 265" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="challenge" data-edge-to="browser" data-edge-label="③ 读环境指纹" data-edge-key="1" data-edge-id="e2" data-composition-points="370,265;280,265" d="M 370 265 L 280 265" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="challenge" data-edge-to="jar" data-edge-label="④ 算出的值写进 cookie" data-edge-key="2" data-edge-id="e3" data-composition-points="490,380;490,450" d="M 490 380 L 490 450" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="jar" data-edge-to="waf" data-edge-label="⑤ 只带这个去重发" data-edge-key="3" data-edge-id="e4" data-composition-points="610,525;840,525;840,380" d="M 610 525 L 832 525 Q 840 525 840 517 L 840 380" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="waf" data-edge-to="api" data-edge-label="⑥ 校验通过" data-edge-key="4" data-edge-id="e5" data-composition-points="960,265;1040,265" d="M 960 265 L 1040 265" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- Components -->
        <g id="node-browser" data-node-id="browser" data-node-label="浏览器环境" tabindex="0" role="button" aria-label="Focus 浏览器环境, 答案的来源, 浏览器进程" aria-pressed="false" data-node-kind="frontend" data-node-sublabel="答案的来源" data-node-context="浏览器进程">
          <title>浏览器环境 · 答案的来源 · 浏览器进程</title>
          <rect x="40" y="150" width="240" height="230" rx="6" class="c-mask"/>
          <rect x="40" y="150" width="240" height="230" rx="6" class="c-frontend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="frontend" class="semantic-sigil s-frontend" transform="translate(46 156) scale(0.6875)">
            <rect x="2" y="3" width="12" height="10" rx="2"/>
            <path d="M2 6.5h12"/>
            <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/>
            <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/>
          </g>
          <text data-detail-anchor x="160" y="263" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">浏览器环境</text>
        <text data-detail="context" x="160" y="279" class="t-muted" font-size="9" text-anchor="middle">答案的来源</text>
        </g>

        <g id="node-challenge" data-node-id="challenge" data-node-label="挑战脚本" tabindex="0" role="button" aria-label="Focus 挑战脚本, 服务器下发，浏览器执行, 浏览器进程" aria-pressed="false" data-node-kind="security" data-node-sublabel="服务器下发，浏览器执行" data-node-context="浏览器进程">
          <title>挑战脚本 · 服务器下发，浏览器执行 · 浏览器进程</title>
          <rect x="370" y="150" width="240" height="230" rx="6" class="c-mask"/>
          <rect x="370" y="150" width="240" height="230" rx="6" class="c-security" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="security" class="semantic-sigil s-security" transform="translate(376 156) scale(0.6875)">
            <path d="M8 2.2 13 4v3.5c0 3.1-1.8 5.4-5 6.5-3.2-1.1-5-3.4-5-6.5V4Z"/>
            <path d="m5.8 8 1.5 1.5 3-3"/>
          </g>
          <text data-detail-anchor x="490" y="263" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">挑战脚本</text>
        <text data-detail="context" x="490" y="279" class="t-muted" font-size="9" text-anchor="middle">服务器下发，浏览器执行</text>
        </g>

        <g id="node-jar" data-node-id="jar" data-node-label="cookie" tabindex="0" role="button" aria-label="Focus cookie, 交完卷才有的通行证, 浏览器进程" aria-pressed="false" data-node-kind="database" data-node-sublabel="交完卷才有的通行证" data-node-context="浏览器进程">
          <title>cookie · 交完卷才有的通行证 · 浏览器进程</title>
          <rect x="370" y="450" width="240" height="150" rx="6" class="c-mask"/>
          <rect x="370" y="450" width="240" height="150" rx="6" class="c-database" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(376 456) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-detail-anchor x="490" y="523" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">cookie</text>
        <text data-detail="context" x="490" y="539" class="t-muted" font-size="9" text-anchor="middle">交完卷才有的通行证</text>
        </g>

        <g id="node-waf" data-node-id="waf" data-node-label="WAF 边缘" tabindex="0" role="button" aria-label="Focus WAF 边缘, 只问一句：有没有合法 cookie, 站点边缘" aria-pressed="false" data-node-kind="security" data-node-sublabel="只问一句：有没有合法 cookie" data-node-context="站点边缘">
          <title>WAF 边缘 · 只问一句：有没有合法 cookie · 站点边缘</title>
          <rect x="720" y="150" width="240" height="230" rx="6" class="c-mask"/>
          <rect x="720" y="150" width="240" height="230" rx="6" class="c-security" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="security" class="semantic-sigil s-security" transform="translate(726 156) scale(0.6875)">
            <path d="M8 2.2 13 4v3.5c0 3.1-1.8 5.4-5 6.5-3.2-1.1-5-3.4-5-6.5V4Z"/>
            <path d="m5.8 8 1.5 1.5 3-3"/>
          </g>
          <text data-detail-anchor x="840" y="263" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">WAF 边缘</text>
        <text data-detail="context" x="840" y="279" class="t-muted" font-size="9" text-anchor="middle">只问一句：有没有合法 cookie</text>
        </g>

        <g id="node-api" data-node-id="api" data-node-label="源站 API" tabindex="0" role="button" aria-label="Focus 源站 API, 真正有数据的地方, 源站" aria-pressed="false" data-node-kind="backend" data-node-sublabel="真正有数据的地方" data-node-context="源站">
          <title>源站 API · 真正有数据的地方 · 源站</title>
          <rect x="1040" y="170" width="190" height="190" rx="6" class="c-mask"/>
          <rect x="1040" y="170" width="190" height="190" rx="6" class="c-backend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(1046 176) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-detail-anchor x="1135" y="263" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">源站 API</text>
        <text data-detail="context" x="1135" y="279" class="t-muted" font-size="9" text-anchor="middle">真正有数据的地方</text>
        </g>

        <!-- Connection labels -->
        <g data-detail="context" data-edge-from="waf" data-edge-to="challenge" data-edge-label="② 下发这段 JS" data-edge-key="0" data-edge-id="e1">
          <rect x="628.8" y="245" width="72.4" height="14" rx="3" class="c-mask"/>
          <text x="665" y="255" class="t-muted" font-size="8" text-anchor="middle">② 下发这段 JS</text>
        </g>
        <g data-detail="context" data-edge-from="challenge" data-edge-to="browser" data-edge-label="③ 读环境指纹" data-edge-key="1" data-edge-id="e2">
          <rect x="291.2" y="223" width="67.6" height="14" rx="3" class="c-mask"/>
          <text x="325" y="233" class="t-muted" font-size="8" text-anchor="middle">③ 读环境指纹</text>
        </g>
        <g data-detail="context" data-edge-from="challenge" data-edge-to="jar" data-edge-label="④ 算出的值写进 cookie" data-edge-key="2" data-edge-id="e3">
          <rect x="434.6" y="405" width="110.8" height="14" rx="3" class="c-mask"/>
          <text x="490" y="415" class="t-muted" font-size="8" text-anchor="middle">④ 算出的值写进 cookie</text>
        </g>
        <g data-detail="context" data-edge-from="jar" data-edge-to="waf" data-edge-label="⑤ 只带这个去重发" data-edge-key="3" data-edge-id="e4">
          <rect x="671.6" y="490" width="86.8" height="14" rx="3" class="c-mask"/>
          <text x="715" y="500" class="t-muted" font-size="8" text-anchor="middle">⑤ 只带这个去重发</text>
        </g>
        <g data-detail="context" data-edge-from="waf" data-edge-to="api" data-edge-label="⑥ 校验通过" data-edge-key="4" data-edge-id="e5">
          <rect x="971" y="245" width="58" height="14" rx="3" class="c-mask"/>
          <text x="1000" y="255" class="t-muted" font-size="8" text-anchor="middle">⑥ 校验通过</text>
        </g>

        <!-- Legend -->
        <g data-legend data-legend-bridge>
          <text x="40" y="664" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="frontend" data-legend-kind="frontend" data-legend-label="Frontend" data-legend-x="40" data-legend-baseline="684" data-legend-width="83">
            <rect x="40" y="675" width="16" height="10" rx="2.5" class="c-frontend" stroke-width="1"/>
            <text x="62" y="684" class="t-muted" font-size="10" font-weight="500">Frontend</text>
          </g>
          <g data-legend-semantic-kind="backend" data-legend-kind="backend" data-legend-label="Backend" data-legend-x="145" data-legend-baseline="684" data-legend-width="78">
            <rect x="145" y="675" width="16" height="10" rx="2.5" class="c-backend" stroke-width="1"/>
            <text x="167" y="684" class="t-muted" font-size="10" font-weight="500">Backend</text>
          </g>
          <g data-legend-semantic-kind="database" data-legend-kind="database" data-legend-label="Database" data-legend-x="245" data-legend-baseline="684" data-legend-width="83">
            <rect x="245" y="675" width="16" height="10" rx="2.5" class="c-database" stroke-width="1"/>
            <text x="267" y="684" class="t-muted" font-size="10" font-weight="500">Database</text>
          </g>
          <g data-legend-semantic-kind="security" data-legend-kind="security" data-legend-label="Security" data-legend-x="350" data-legend-baseline="684" data-legend-width="83">
            <rect x="350" y="675" width="16" height="10" rx="2.5" class="c-security" stroke-width="1"/>
            <text x="372" y="684" class="t-muted" font-size="10" font-weight="500">Security</text>
