        </g>

        <g id="node-sub" data-node-id="sub" data-node-label="Subtask" tabindex="0" role="button" aria-label="Focus Subtask, 算子的一个并行副本。parallelism = 3 就有 3 个, 逻辑 · 客户端生成" aria-pressed="false" data-node-kind="backend" data-node-sublabel="算子的一个并行副本。parallelism = 3 就有 3 个" data-node-context="逻辑 · 客户端生成">
