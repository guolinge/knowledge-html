<svg viewBox="0 0 1004 784" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">五个极易混的词，其实是五层</title>
        <desc id="archify-diagram-description">从你写的那行代码，到真正跑它的那个线程 —— 一层套一层</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="0" x="316" y="56" width="308" height="240" rx="12" class="c-region" stroke-width="1"/>
        <text x="324" y="74" class="t-cloud" font-size="9" font-weight="600">逻辑 · 客户端生成</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="1" x="316" y="336" width="648" height="380" rx="12" class="c-region" stroke-width="1"/>
        <text x="324" y="354" class="t-cloud" font-size="9" font-weight="600">物理 · 集群上真跑的东西</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path data-edge-from="op" data-edge-to="sub" data-edge-label="切成 N 份" data-edge-key="0" data-edge-id="e1" data-composition-points="470,136;470,220" d="M 470 136 L 470 220" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="sub" data-edge-to="task" data-edge-label="落进某个 Task" data-edge-key="1" data-edge-id="e2" data-composition-points="470,276;470,360" d="M 470 276 L 470 360" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
