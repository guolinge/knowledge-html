        <g id="node-op" data-node-id="op" data-node-label="Operator" tabindex="0" role="button" aria-label="Focus Operator, 逻辑上的一个处理步骤。它没有并行度, 逻辑 · 客户端生成" aria-pressed="false" data-node-kind="backend" data-node-sublabel="逻辑上的一个处理步骤。它没有并行度" data-node-context="逻辑 · 客户端生成">
