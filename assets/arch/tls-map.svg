        <text x="148" y="138" class="t-cloud" font-size="9" font-weight="600">线程 A 私有 · fs 指向 A 的 TCB，RSP 指在 A 的栈顶</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="1" data-frame-members="tlsB stackB" x="820" y="120" width="660" height="400" rx="12" class="c-region" stroke-width="1"/>
        <text x="828" y="138" class="t-cloud" font-size="9" font-weight="600">线程 B 私有 · 同样的布局，另一套基址</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path data-edge-from="insn" data-edge-to="tlsA" data-edge-label="fs + 偏移" data-edge-key="0" data-edge-id="a-tls" data-composition-points="790,700;790,560;325,560;325,480" d="M 790 700 L 790 568 Q 790 560 782 560 L 333 560 Q 325 560 325 552 L 325 480" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
