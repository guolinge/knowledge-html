<svg viewBox="0 0 1580 1020" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">TLS 与线程栈：同一份代码、两条寻址路线</title>
        <desc id="archify-diagram-description">两条线程各自有一块 TLS 区和一根用户栈；同一条指令靠不同的基址落到各自的副本上</desc>
        <!-- Definitions -->
