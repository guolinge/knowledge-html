<svg viewBox="0 0 1240 314" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">数据到了，怎么唤醒你的那行代码</title>
        <desc id="archify-diagram-description">同样从左到右，一次唤醒</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
