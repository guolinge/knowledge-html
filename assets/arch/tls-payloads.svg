        <text x="608" y="258" class="t-cloud" font-size="9" font-weight="600">这条线程的 TLS 区 · 每线程一块，地址由 TP 决定</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="1" data-frame-members="heap" x="1060" y="840" width="420" height="220" rx="12" class="c-region" stroke-width="1"/>
        <text x="1068" y="858" class="t-cloud" font-size="9" font-weight="600">堆 · 全进程共享</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path data-edge-from="libc" data-edge-to="tls" data-edge-label="errno、tcache、canary" data-edge-key="0" data-edge-id="from-libc" data-composition-points="500,255;570,255;570,438;640,438" d="M 500 255 L 562 255 Q 570 255 570 263 L 570 430 Q 570 438 578 438 L 640 438" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
