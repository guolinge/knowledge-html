<svg viewBox="0 0 1580 1060" role="img" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">一条线程的两根栈：进内核时 SP 指向哪</title>
        <desc id="archify-diagram-description">同一条执行流、同一个 task，进内核只换权限级和栈指针</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="0" data-frame-members="code ustack" x="66.1" y="60" width="893.6" height="260" rx="12" class="c-region" stroke-width="1"/>
        <text x="74.1" y="78" class="t-cloud" font-size="9" font-weight="600">用户空间 · 程序自己的内存</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="1" data-frame-members="task kstack irqstack" x="66.1" y="560" width="1353.4" height="370" rx="12" class="c-region" stroke-width="1"/>
        <text x="74.1" y="578" class="t-cloud" font-size="9" font-weight="600">内核空间 · 内核的内存</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path data-edge-from="code" data-edge-to="entry" data-edge-label="执行到 syscall 指令" data-edge-key="0" data-edge-id="to-entry" data-composition-points="282.95,280;282.95,460;530.6,460" d="M 282.95 280 L 282.95 452 Q 282.95 460 290.95 460 L 530.6 460" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="entry" data-edge-to="kstack" data-edge-label="换栈" data-edge-key="1" data-edge-id="switch" data-composition-points="725.1500000000001,520;725.1500000000001,600" d="M 725.1500000000001 520 L 725.1500000000001 600" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="task" data-edge-to="kstack" data-edge-label="thread.sp" data-edge-key="2" data-edge-id="sp" data-composition-points="424.5,705;530.6,705" d="M 424.5 705 L 530.6 705" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="kstack" data-edge-to="ustack" data-edge-label="返回：从 pt_regs 恢复 SP" data-edge-key="3" data-edge-id="back" data-composition-points="919.7,705;1462.1,705;1462.1,190;919.7,190" d="M 919.7 705 L 1454.1 705 Q 1462.1 705 1462.1 697 L 1462.1 198 Q 1462.1 190 1454.1 190 L 919.7 190" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- Components -->
        <g id="node-code" data-node-id="code" data-node-label="代码段 · RIP 在这儿" tabindex="0" role="button" aria-label="Focus 代码段 · RIP 在这儿, 执行到下一条指令, 用户空间 · 程序自己的内存" aria-pressed="false" data-node-kind="backend" data-node-sublabel="执行到下一条指令" data-node-context="用户空间 · 程序自己的内存">
          <title>代码段 · RIP 在这儿 · 执行到下一条指令 · 用户空间 · 程序自己的内存</title>
          <rect x="106.1" y="100" width="353.7" height="180" rx="6" class="c-mask"/>
          <rect x="106.1" y="100" width="353.7" height="180" rx="6" class="c-backend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(112.1 106) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-detail-anchor x="282.95" y="188" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">代码段 · RIP 在这儿</text>
        <text data-detail="context" x="282.95" y="204" class="t-muted" font-size="9" text-anchor="middle">执行到下一条指令</text>
        </g>

        <g id="node-ustack" data-node-id="ustack" data-node-label="用户栈 · SP 在这儿" tabindex="0" role="button" aria-label="Focus 用户栈 · SP 在这儿, 这条线程的函数调用, 用户空间 · 程序自己的内存" aria-pressed="false" data-node-kind="backend" data-node-sublabel="这条线程的函数调用" data-node-context="用户空间 · 程序自己的内存">
          <title>用户栈 · SP 在这儿 · 这条线程的函数调用 · 用户空间 · 程序自己的内存</title>
          <rect x="530.6" y="100" width="389.1" height="180" rx="6" class="c-mask"/>
          <rect x="530.6" y="100" width="389.1" height="180" rx="6" class="c-backend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(536.6 106) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-detail-anchor x="725.1500000000001" y="188" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">用户栈 · SP 在这儿</text>
        <text data-detail="context" x="725.1500000000001" y="204" class="t-muted" font-size="9" text-anchor="middle">这条线程的函数调用</text>
        </g>

        <g id="node-entry" data-node-id="entry" data-node-label="进门：syscall / 缺页" tabindex="0" role="button" aria-label="Focus 进门：syscall / 缺页, 权限级 3 → 0，换栈，压现场, Architecture component" aria-pressed="false" data-node-kind="security" data-node-sublabel="权限级 3 → 0，换栈，压现场" data-node-context="Architecture component">
          <title>进门：syscall / 缺页 · 权限级 3 → 0，换栈，压现场 · Architecture component</title>
          <rect x="530.6" y="400" width="389.1" height="120" rx="6" class="c-mask"/>
          <rect x="530.6" y="400" width="389.1" height="120" rx="6" class="c-security" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="security" class="semantic-sigil s-security" transform="translate(536.6 406) scale(0.6875)">
            <path d="M8 2.2 13 4v3.5c0 3.1-1.8 5.4-5 6.5-3.2-1.1-5-3.4-5-6.5V4Z"/>
            <path d="m5.8 8 1.5 1.5 3-3"/>
          </g>
          <text data-detail-anchor x="725.1500000000001" y="458" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">进门：syscall / 缺页</text>
        <text data-detail="context" x="725.1500000000001" y="474" class="t-muted" font-size="9" text-anchor="middle">权限级 3 → 0，换栈，压现场</text>
        </g>

        <g id="node-task" data-node-id="task" data-node-label="task T1" tabindex="0" role="button" aria-label="Focus task T1, 内核记着这条执行流, 内核空间 · 内核的内存" aria-pressed="false" data-node-kind="database" data-node-sublabel="内核记着这条执行流" data-node-context="内核空间 · 内核的内存">
          <title>task T1 · 内核记着这条执行流 · 内核空间 · 内核的内存</title>
          <rect x="106.1" y="600" width="318.4" height="210" rx="6" class="c-mask"/>
          <rect x="106.1" y="600" width="318.4" height="210" rx="6" class="c-database" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(112.1 606) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-detail-anchor x="265.29999999999995" y="703" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">task T1</text>
        <text data-detail="context" x="265.29999999999995" y="719" class="t-muted" font-size="9" text-anchor="middle">内核记着这条执行流</text>
        </g>

        <g id="node-kstack" data-node-id="kstack" data-node-label="内核栈 · SP 换到这儿" tabindex="0" role="button" aria-label="Focus 内核栈 · SP 换到这儿, 16 KiB，每条线程一根, 内核空间 · 内核的内存" aria-pressed="false" data-node-kind="database" data-node-sublabel="16 KiB，每条线程一根" data-node-context="内核空间 · 内核的内存">
          <title>内核栈 · SP 换到这儿 · 16 KiB，每条线程一根 · 内核空间 · 内核的内存</title>
          <rect x="530.6" y="600" width="389.1" height="210" rx="6" class="c-mask"/>
          <rect x="530.6" y="600" width="389.1" height="210" rx="6" class="c-database" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(536.6 606) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-detail-anchor x="725.1500000000001" y="703" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">内核栈 · SP 换到这儿</text>
        <text data-detail="context" x="725.1500000000001" y="719" class="t-muted" font-size="9" text-anchor="middle">16 KiB，每条线程一根</text>
        </g>

        <g id="node-irqstack" data-node-id="irqstack" data-node-label="中断栈 · 例外" tabindex="0" role="button" aria-label="Focus 中断栈 · 例外, 每 CPU 一根，不属某条线程, 内核空间 · 内核的内存" aria-pressed="false" data-node-kind="database" data-node-sublabel="每 CPU 一根，不属某条线程" data-node-context="内核空间 · 内核的内存">
          <title>中断栈 · 例外 · 每 CPU 一根，不属某条线程 · 内核空间 · 内核的内存</title>
          <rect x="1025.8" y="750" width="353.7" height="140" rx="6" class="c-mask"/>
          <rect x="1025.8" y="750" width="353.7" height="140" rx="6" class="c-database" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(1031.8 756) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-detail-anchor x="1202.6499999999999" y="818" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">中断栈 · 例外</text>
        <text data-detail="context" x="1202.6499999999999" y="834" class="t-muted" font-size="9" text-anchor="middle">每 CPU 一根，不属某条线程</text>
        </g>

        <!-- Connection labels -->
        <g data-detail="context" data-edge-from="code" data-edge-to="entry" data-edge-label="执行到 syscall 指令" data-edge-key="0" data-edge-id="to-entry">
          <rect x="356.17499999999995" y="440" width="101.2" height="14" rx="3" class="c-mask"/>
          <text x="406.775" y="450" class="t-muted" font-size="8" text-anchor="middle">执行到 syscall 指令</text>
        </g>
        <g data-detail="context" data-edge-from="entry" data-edge-to="kstack" data-edge-label="换栈" data-edge-key="1" data-edge-id="switch">
          <rect x="710.1" y="556" width="30" height="14" rx="3" class="c-mask"/>
          <text x="725.1" y="566" class="t-backend" font-size="8" text-anchor="middle">换栈</text>
        </g>
        <g data-detail="context" data-edge-from="task" data-edge-to="kstack" data-edge-label="thread.sp" data-edge-key="2" data-edge-id="sp">
          <rect x="450.95" y="685" width="53.199999999999996" height="14" rx="3" class="c-mask"/>
          <text x="477.55" y="695" class="t-muted" font-size="8" text-anchor="middle">thread.sp</text>
        </g>
        <g data-detail="context" data-edge-from="kstack" data-edge-to="ustack" data-edge-label="返回：从 pt_regs 恢复 SP" data-edge-key="3" data-edge-id="back">
          <rect x="1399.5" y="427.5" width="125.19999999999999" height="14" rx="3" class="c-mask"/>
